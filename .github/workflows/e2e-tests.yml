name: E2E Tests

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:
    inputs:
      e2e_tests_ref:
        description: "Branch or ref of sdk-e2e-tests to use"
        required: false
        default: "main"

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  e2e-tests:
    # Skip for forks — E2E tests require internal infrastructure
    if: ${{ !github.event.pull_request.head.repo.fork }}
    runs-on: ubuntu-x64

    steps:
      - name: Checkout SDK
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          path: sdk

      - name: Checkout sdk-e2e-tests
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          repository: segmentio/sdk-e2e-tests
          ref: ${{ inputs.e2e_tests_ref || 'main' }}
          path: sdk-e2e-tests

      - name: Setup PHP
        uses: shivammathur/setup-php@cf4cade2721270509d5b1c766dad417c269cbb11 # v2
        with:
          php-version: "8.2"
          extensions: curl, json

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Configure Artifactory
        uses: ./sdk/.github/actions/artifactory-oidc
        with:
          artifactory_url: ${{ vars.ARTIFACTORY_URL }}

      - name: Install SDK dependencies
        working-directory: sdk
        run: composer install --no-scripts --no-interaction --prefer-dist

      - name: Run E2E tests
        working-directory: sdk-e2e-tests
        run: |
          ./scripts/run-tests.sh \
            --sdk-dir "${{ github.workspace }}/sdk/e2e-cli" \
            --cli "php ${{ github.workspace }}/sdk/e2e-cli/main.php"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: sdk-e2e-tests/test-results/
          if-no-files-found: ignore
